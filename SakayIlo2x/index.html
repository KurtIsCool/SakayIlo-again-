<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iloilo Jeepney Vanilla Routing</title>
  
  <!-- Load Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Load Turf.js (Provides generic 'turf' global var) -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      color: #333;
    }
    #sidebar {
      width: 350px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      z-index: 1000;
      position: relative;
    }
    .header {
      padding: 20px;
      background: #15803d; /* Green */
      color: white;
    }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
    }
    .controls {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
      background: white;
    }
    .controls label {
      display: block;
      font-weight: 500;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .controls input[type="range"] {
      width: 100%;
    }
    #results {
      padding: 20px;
      flex-grow: 1;
      overflow-y: auto;
      background: #fdfdfd;
    }
    #map {
      flex-grow: 1;
      height: 100%;
      z-index: 0;
    }
    .step {
      padding: 12px;
      background: white;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      font-size: 0.9rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .step h4 { margin: 0 0 4px 0; }
  </style>
</head>
<body>
  
  <div id="sidebar">
    <div class="header">
      <h1>Jeepney Router (Debug)</h1>
    </div>
    
    <div class="controls">
      <label>Max Walk Distance (m): <span id="walkVal">800</span></label>
      <input type="range" id="walkDist" min="100" max="2000" step="100" value="800" oninput="document.getElementById('walkVal').textContent = this.value">
      <p style="font-size: 12px; color: #666; margin-top: 10px;">Open DevTools console to see the engine's Turf.js logging!</p>
    </div>
    
    <div id="results">
      <p>Drag the green/red markers to begin.</p>
    </div>
  </div>
  
  <div id="map"></div>
  
  <!-- Use module to support imports -->
  <script src="/src/app.js" type="module"></script>
</body>
</html>
